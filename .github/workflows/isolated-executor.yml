name: Isolated executor offline integration
on:
  push:
    branches: [feature/isolated-executor-v061-integration, feature/historical-reconciliation-v062, fix/v063-connection-recovery]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record actual tested checkout
        run: python -c "from pathlib import Path; import subprocess; p = Path(r'${{ runner.temp }}/isolated-artifacts/COMMIT_SHA.txt'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True), encoding='ascii')"
      - name: Install offline dependencies
        run: python -m pip install -e ".[test,isolated]" build
      - name: Full offline regression
        run: python -m pytest -q tests --junitxml="${{ runner.temp }}/isolated-artifacts/full.xml"
      - name: Focused coordination and isolation regression
        run: python -m pytest -q tests/test_coordination.py tests/test_isolated_executor.py tests/test_isolated_integration.py tests/test_isolated_release.py tests/test_historical_evidence.py tests/test_historical_ledger.py tests/test_historical_recovery.py tests/test_connection_supervisor.py tests/test_scheduled_cli.py tests/test_central_reliability.py tests/test_readonly_dispatch.py --junitxml="${{ runner.temp }}/isolated-artifacts/isolated.xml"
      - name: Build installable distributions
        run: python -m build --outdir "${{ runner.temp }}/isolated-artifacts/dist"
      - name: Build complete skill ZIP
        run: python scripts/release.py --output "${{ runner.temp }}/isolated-artifacts/Paper2Simu-v0.6.3.zip"
      - name: Assert execution counts and release hashes
        run: python scripts/check_isolated_release.py --junit "${{ runner.temp }}/isolated-artifacts/full.xml" --junit "${{ runner.temp }}/isolated-artifacts/isolated.xml" --require-test-module test_coordination --require-test-module test_isolated_executor --require-test-module test_isolated_integration --require-test-module test_isolated_release --require-test-module test_historical_evidence --require-test-module test_historical_ledger --require-test-module test_historical_recovery --require-test-module test_connection_supervisor --require-test-module test_scheduled_cli --require-test-module test_central_reliability --require-test-module test_readonly_dispatch --zip "${{ runner.temp }}/isolated-artifacts/Paper2Simu-v0.6.3.zip" --output "${{ runner.temp }}/isolated-artifacts/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-offline-${{ matrix.os }}
          path: ${{ runner.temp }}/isolated-artifacts/
          if-no-files-found: error
