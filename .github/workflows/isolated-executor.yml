name: Isolated executor offline integration
on:
  push:
    branches: [feature/isolated-executor-v061-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline dependencies
        run: python -m pip install -e ".[test,isolated]" build
      - name: Full offline regression
        run: python -m pytest -q tests --junitxml=../isolated-artifacts/full.xml
      - name: Focused coordination and isolation regression
        run: python -m pytest -q tests/test_coordination.py tests/test_isolated_executor.py tests/test_isolated_integration.py tests/test_isolated_release.py --junitxml=../isolated-artifacts/isolated.xml
      - name: Build installable distributions
        run: python -m build --outdir ../isolated-artifacts/dist
      - name: Build complete skill ZIP
        run: python scripts/release.py --output ../isolated-artifacts/Paper2Simu-v0.6.1.zip
      - name: Assert execution counts and release hashes
        run: python scripts/check_isolated_release.py --junit ../isolated-artifacts/full.xml --junit ../isolated-artifacts/isolated.xml --require-test-module test_coordination --require-test-module test_isolated_executor --require-test-module test_isolated_integration --require-test-module test_isolated_release --zip ../isolated-artifacts/Paper2Simu-v0.6.1.zip --output ../isolated-artifacts/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-offline-${{ matrix.os }}
          path: ../isolated-artifacts/
          if-no-files-found: error
