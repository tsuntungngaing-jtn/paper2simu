name: RSI Retrieval and Evaluation Tests
on:
  pull_request:
    paths:
      - 'rsi/**'
      - 'tests/**'
      - 'docs/context-retrieval-rsi-evaluation.md'
      - '.github/workflows/rsi-retrieval-evaluation.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and unit-test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run regression suite without COMSOL
        shell: bash
        run: |
          set -o pipefail
          python -m pip freeze > rsi-dependencies.txt
          python -m unittest discover -s tests -v 2>&1 | tee rsi-unittest.log
      - name: Retain regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-regression-diagnostics
          path: |
            rsi-dependencies.txt
            rsi-unittest.log
      - name: Clarify validation scope
        run: echo 'Unit and mock tests only; real-COMSOL physical validation NOT_RUN.'
